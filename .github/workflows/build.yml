name: Build SDVIG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folder
        run: |
          flutter create --platforms=android --project-name sdvig_music --org com.sdvig _gen
          cp -r _gen/android ./android
          rm -rf _gen
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="sdvig_music"#android:label="SDVIG"#' android/app/src/main/AndroidManifest.xml
          cp -r assets/android_res/. android/app/src/main/res/
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SDVIG-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folder
        run: |
          flutter create --platforms=windows --project-name sdvig_music --org com.sdvig _gen
          cp -r _gen/windows ./windows
          rm -rf _gen
          cp assets/windows/app_icon.ico windows/runner/resources/app_icon.ico
          sed -i 's/"sdvig_music"/"SDVIG"/g' windows/CMakeLists.txt
          sed -i 's/sdvig_music/SDVIG/g' windows/runner/Runner.rc windows/runner/main.cpp
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: SDVIG-windows
          path: build/windows/x64/runner/Release

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev mpv libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folder
        run: |
          flutter create --platforms=linux --project-name sdvig_music --org com.sdvig _gen
          cp -r _gen/linux ./linux
          rm -rf _gen
          sed -i 's/"sdvig_music"/"SDVIG"/g' linux/CMakeLists.txt linux/runner/my_application.cc
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: SDVIG-linux
          path: build/linux/x64/release/bundle
